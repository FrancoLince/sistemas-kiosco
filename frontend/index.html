<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco POS | Modo Cajero</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="pos-container">
        <!-- Main Top Bar -->
        <header class="pos-header">
            <h1>Punto de Venta</h1>
            <div style="display: flex; gap: 12px; align-items: center;">
                <button id="btn-open-history-modal" class="btn-secondary" type="button">
                    📊 Ver Ventas / Compras
                </button>
                <button id="btn-open-product-modal" class="btn-secondary" type="button">
                    + Nuevo Producto
                </button>
                <div class="search-box">
                    <input type="text" id="barcode-input" placeholder="Escanear código, buscar o '3*' para multiplicar... (F2)" autocomplete="off">
                </div>
            </div>
        </header>

        <!-- POS Workstation Layout -->
        <div class="pos-layout">
            <!-- Catalog Side -->
            <section class="pos-catalog">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <h2 class="section-title">Catálogo de Productos</h2>
                    <!-- Chips de Categorías -->
                    <div id="category-chips" class="category-chips-container">
                        <button class="chip active" data-cat-id="all">Todos</button>
                        <!-- Dynamic Categories -->
                    </div>
                </div>

                <div id="products-list">
                    <!-- Cards populated dynamically -->
                </div>
            </section>

            <!-- Checkout Ticket Side -->
            <aside class="pos-ticket">
                <h2>Ticket de Venta</h2>
                
                <div id="ticket-items">
                    <!-- Selected items list -->
                </div>

                <div class="ticket-summary">
                    <div class="summary-line">
                        <span>Método de Pago (F4)</span>
                        <select id="payment-method">
                            <option value="efectivo">Efectivo</option>
                            <option value="tarjeta">Tarjeta Débito/Crédito</option>
                            <option value="transferencia">Transferencia / MercadoPago</option>
                        </select>
                    </div>

                    <div class="summary-line total-line">
                        <span>TOTAL</span>
                        <strong id="ticket-total">$0,00</strong>
                    </div>

                    <button id="btn-finish-sale" class="btn-complete-sale" type="button">
                        COBRAR (Enter)
                    </button>
                </div>
            </aside>
        </div>
    </div>

    <!-- Modal Carga / Edición de Producto -->
    <div id="product-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modal-title">Agregar Nuevo Producto</h2>
                <button id="btn-close-modal" class="btn-close-modal" type="button">&times;</button>
            </div>
            <form id="product-form" class="modal-form">
                <input type="hidden" id="product-id">
                
                <div class="form-group">
                    <label for="product-name">Nombre del Producto *</label>
                    <input type="text" id="product-name" placeholder="Ej. Coca Cola 1.5L" required autocomplete="off">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="product-barcode">Código de Barras</label>
                        <input type="text" id="product-barcode" placeholder="Escanear o ingresar número" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="product-category">Categoría</label>
                        <select id="product-category" style="padding: 10px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-subtle);">
                            <option value="">Sin Categoría</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="product-image">URL de la Imagen (Opcional)</label>
                    <input type="url" id="product-image" placeholder="https://ejemplo.com/imagen.jpg" autocomplete="off">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="product-cost-price">Precio Costo ($)</label>
                        <input type="number" id="product-cost-price" step="0.01" min="0" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="product-price">Precio Venta ($) *</label>
                        <input type="number" id="product-price" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="product-stock">Stock Actual</label>
                        <input type="number" id="product-stock" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="product-min-stock">Stock Mínimo</label>
                        <input type="number" id="product-min-stock" min="0" value="5">
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
                    <button type="button" id="btn-delete-product" class="btn-remove" style="display: none; padding: 8px 14px; width: auto; height: auto;">
                        🗑️ Eliminar Producto
                    </button>
                    <div style="display: flex; gap: 10px; margin-left: auto;">
                        <button type="button" id="btn-cancel-modal" class="btn-secondary">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar Producto</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Historial y Reporte de Ventas / Reposición -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-card" style="max-width: 700px;">
            <div class="modal-header">
                <h2>Cierre de Caja & Reposición</h2>
                <button id="btn-close-history-modal" class="btn-close-modal" type="button">&times;</button>
            </div>
            
            <div class="modal-body" style="display: flex; flex-direction: column; gap: 16px;">
                <!-- Tarjetas de Totales -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;">
                    <div style="background: var(--bg-subtle); padding: 12px; border-radius: var(--radius-md); text-align: center;">
                        <small style="color: var(--text-muted); font-weight: 600;">TOTAL DÍA</small>
                        <h3 id="report-grand-total" style="color: var(--color-success); font-size: 1.2rem;">$0,00</h3>
                    </div>
                    <div style="background: var(--bg-subtle); padding: 12px; border-radius: var(--radius-md); text-align: center;">
                        <small style="color: var(--text-muted); font-weight: 600;">GANANCIA LIMPIA</small>
                        <h3 id="report-net-profit" style="color: #2563eb; font-size: 1.2rem;">$0,00</h3>
                    </div>
                    <div style="background: var(--bg-subtle); padding: 12px; border-radius: var(--radius-md); text-align: center;">
                        <small style="color: var(--text-muted); font-weight: 600;">EFECTIVO</small>
                        <h3 id="report-cash-total" style="font-size: 1.1rem;">$0,00</h3>
                    </div>
                    <div style="background: var(--bg-subtle); padding: 12px; border-radius: var(--radius-md); text-align: center;">
                        <small style="color: var(--text-muted); font-weight: 600;">MERCADO PAGO</small>
                        <h3 id="report-mp-total" style="font-size: 1.1rem;">$0,00</h3>
                    </div>
                </div>

                <!-- Tabs de sección -->
                <div style="display: flex; gap: 10px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px;">
                    <button id="tab-sales-btn" class="btn-secondary active" style="padding: 6px 12px; font-size: 0.85rem;">🛒 Últimas Ventas</button>
                    <button id="tab-replenish-btn" class="btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;">⚠️ Lista de Reposición</button>
                </div>

                <!-- Lista de Ventas con Scroll -->
                <div id="sales-history-list" style="max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                    <!-- Filas generadas dinámicamente -->
                </div>

                <!-- Lista de Reposición (Oculta por defecto) -->
                <div id="replenishment-list" style="max-height: 280px; overflow-y: auto; display: none; flex-direction: column; gap: 10px;">
                    <!-- Filas de reponer generadas dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic Modules -->
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/pos.js"></script>
</body>
</html>
